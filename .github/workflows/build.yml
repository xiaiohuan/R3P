name: 新路由3 LEDE 全能版编译
on:
  workflow_dispatch:

env:
  LEDE_URL: https://github.com/coolsnowwolf/lede
  LEDE_BRANCH: master
  ROUTER_IP: 192.168.99.1

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt update -y
          sudo apt install -y build-essential libncurses5-dev git libssl-dev python3 unzip curl wget rsync time

      - name: 克隆 LEDE 源码
        run: |
          git clone -b $LEDE_BRANCH $LEDE_URL lede
          cd lede

      - name: 修改默认IP
        run: |
          cd lede
          sed -i "s/192.168.1.1/$ROUTER_IP/g" package/base-files/files/bin/config_generate

      - name: 无线&USB3.0优化补丁
        run: |
          cd lede
          # USB3.0全速抗干扰
          echo 'mt7621-usb3-disable-phy-algo' >> target/linux/ramips/patches-5.10/999-usb3-fix.patch
          sed -i '/set usb3=/c\set usb3="1"' target/linux/ramips/mt7621/base-files/etc/init.d/bootcount
          # 无线功率拉满
          sed -i 's/option txpower .*/option txpower 30/' package/network/services/wpad/files/wpad.config || true
          sed -i 's/maxpower=.*/maxpower=30/' package/kernel/mt76/Makefile || true

      - name: 更新feeds
        run: |
          cd lede
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 写入.config配置
        run: |
          cd lede
          cat > .config <<'EOF'
CONFIG_TARGET_ramips=y
CONFIG_TARGET_ramips_mt7621=y
CONFIG_TARGET_ramips_mt7621_DEVICE_newifi_d2=y
CONFIG_BUILD_PATENTED=y
CONFIG_CLEAN_IPKG=y
CONFIG_LIBCURL_COOKIES=y
CONFIG_LIBCURL_FILE=y
CONFIG_LIBCURL_FTP=y
CONFIG_LIBCURL_HTTP=y
CONFIG_LIBCURL_HTTPS=y
CONFIG_LIBCURL_MBEDTLS=y
CONFIG_LIBCURL_PROXY=y
CONFIG_PACKAGE_kmod-usb-storage=y
CONFIG_PACKAGE_kmod-usb-ohci=y
CONFIG_PACKAGE_kmod-usb-uhci=y
CONFIG_PACKAGE_kmod-usb3=y
CONFIG_PACKAGE_kmod-usb-xhci=y
CONFIG_PACKAGE_kmod-usb-net=y
CONFIG_PACKAGE_kmod-usb-net-rndis=y
CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y
CONFIG_PACKAGE_kmod-fs-ext4=y
CONFIG_PACKAGE_kmod-fs-ntfs3=y
CONFIG_PACKAGE_kmod-fs-vfat=y
CONFIG_PACKAGE_kmod-nls-cp936=y
CONFIG_PACKAGE_kmod-nls-utf8=y
CONFIG_PACKAGE_kmod-mt7603=y
CONFIG_PACKAGE_kmod-mt7612=y
CONFIG_PACKAGE_wpad-full=y
CONFIG_PACKAGE_iw=y
CONFIG_PACKAGE_iwinfo=y
CONFIG_PACKAGE_luci-app-p910nd=y
CONFIG_PACKAGE_p910nd=y
CONFIG_PACKAGE_luci-app-samba4=y
CONFIG_PACKAGE_samba4-server=y
CONFIG_PACKAGE_luci-theme-argon=y
CONFIG_PACKAGE_luci-theme-bootstrap=y
CONFIG_PACKAGE_luci-compat=y
CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
CONFIG_PACKAGE_curl=y
CONFIG_PACKAGE_wget=y
CONFIG_PACKAGE_nano=y
CONFIG_PACKAGE_openssh-sftp-server=y
EOF
          make defconfig

      - name: 下载依赖
        run: |
          cd lede
          make -j$(nproc) download

      - name: 编译固件
        run: |
          cd lede
          make -j$(nproc)

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: 新路由3-LEDE全能版_192.168.99.1
          path: lede/bin/targets/ramips/mt7621/*.bin
